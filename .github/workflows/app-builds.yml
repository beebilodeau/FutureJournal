name: App builds

# Builds the Android test APK (and checks the iOS project compiles) from the
# same static site the website uses. The APK is attached to the run as an
# artifact, not published as a release, because this repo is public.
on:
  workflow_dispatch:
  push:
    branches: [store-prep, main]
    paths:
      - "src/**"
      - "public/**"
      - "android/**"
      - "ios/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/app-builds.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK (sideload-signed)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk futurejournal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: futurejournal-apk
          path: futurejournal.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use the newest Xcode on the runner
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for the simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test ${PIPESTATUS[0]} -eq 0
